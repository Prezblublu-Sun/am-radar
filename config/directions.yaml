version: 1

directions:

  mechanical_properties:
    display_name: "AM Mechanical Properties"
    llm_prompt_focus: |
      This direction tracks the MECHANICAL PERFORMANCE of additively manufactured (and closely relevant) metal parts. A purely materials/mechanical-engineering paper IS on-topic; it does NOT need any biomedical, clinical, FEA-surrogate, or AI context, and must NOT be penalized for lacking them. Modeling, simulation, and computational studies (FE, crystal plasticity, phase-field, lattice/topology modeling, ML prediction) are fully in scope and judged on their own merit — do NOT down-rank a paper merely for being computational rather than experimental.
      Direct (High if novel + has experimental mechanical data): quantitative tensile/yield/ultimate strength, elongation, ductility, hardness, fracture toughness, strain hardening, or build-orientation anisotropy of AM metals (Ti-6Al-4V, AlSi10Mg, 316L, IN718, etc.).
      Medium: reviews of AM mechanical performance, or conventional-process mechanical studies with a method transferable to AM.
      Low: process/thermal/microstructure papers reporting NO mechanical-property data; pure simulation with no experimental mechanical results.
      Exclude: non-metal / non-mechanical topics, drug or purely clinical papers.
    color: "#2E7D6B"
    sources:
      arxiv_categories: ["cond-mat.mtrl-sci"]
      openalex_concepts: []
      openalex_keywords:
        - "additive manufacturing mechanical properties"
        - "tensile properties additive manufacturing"
        - "selective laser melting mechanical properties"
        - "build orientation anisotropy"
      pubmed_terms:
        - "additive manufacturing mechanical properties implant"
    strong_keywords:
      - "tensile strength"
      - "yield strength"
      - "ultimate tensile strength"
      - "elongation"
      - "mechanical anisotropy"
      - "build orientation"
      - "fracture toughness"
      - "strain hardening"
      - "ductility"

  fatigue:
    display_name: "AM Fatigue"
    llm_prompt_focus: |
      This direction tracks FATIGUE behaviour of additively manufactured (and relevant Ti-6Al-4V / metal) parts. A pure materials/mechanics fatigue paper IS on-topic and needs NO biomedical, clinical, or AI context; do not penalize its absence. Modeling, simulation, and computational studies (FE, crystal plasticity, phase-field, lattice/topology modeling, ML prediction) are fully in scope and judged on their own merit — do NOT down-rank a paper merely for being computational rather than experimental.
      Direct (High if novel + experimental fatigue data): fatigue life, S-N curve, fatigue strength/limit, high/low/very-high cycle fatigue, fatigue crack initiation or growth, defect- or porosity-driven fatigue, as-built vs post-processed fatigue of AM parts.
      Medium: fatigue reviews, or conventional-alloy fatigue studies whose method transfers to AM.
      Low: papers mentioning fatigue only in passing with no fatigue data/analysis.
      Exclude: unrelated topics with no fatigue content.
    color: "#C0392B"
    sources:
      arxiv_categories: ["cond-mat.mtrl-sci"]
      openalex_concepts: []
      openalex_keywords:
        - "additive manufacturing fatigue"
        - "fatigue selective laser melting"
        - "fatigue laser powder bed fusion"
        - "fatigue behavior additive manufacturing"
        - "defect fatigue additive manufacturing"
        - "as-built fatigue additive manufacturing"
        - "fatigue Ti-6Al-4V additive"
      pubmed_terms:
        - "additive manufacturing implant fatigue"
    strong_keywords:
      - "fatigue"
      - "fatigue life"
      - "fatigue strength"
      - "fatigue behavior"
      - "fatigue behaviour"
      - "fatigue performance"
      - "fatigue properties"
      - "fatigue resistance"
      - "fatigue test"
      - "fatigue crack"
      - "s-n curve"
      - "high cycle fatigue"
      - "low cycle fatigue"
      - "very high cycle fatigue"
      - "cyclic loading"
      - "crack propagation"

  ti6al4v_postprocess_hip:
    display_name: "Ti-6Al-4V Post-processing & HIP"
    llm_prompt_focus: |
      This direction tracks POST-PROCESSING of additively manufactured Ti-6Al-4V (and similar Ti alloys), especially Hot Isostatic Pressing (HIP = hot isostatic pressing, NOT hip joint), heat treatment, annealing, stress relief, and their effect on microstructure / porosity / mechanical & fatigue properties. Pure materials-science papers are on-topic; no biomedical/clinical context required. Modeling, simulation, and computational studies (FE, crystal plasticity, phase-field, lattice/topology modeling, ML prediction) are fully in scope and judged on their own merit — do NOT down-rank a paper merely for being computational rather than experimental.
      Direct (High if novel + experimental): effect of HIP, heat treatment, annealing, solution/aging treatment, or other post-processing on AM Ti-6Al-4V microstructure, defect/porosity closure, tensile, or fatigue performance.
      Medium: as-built Ti-6Al-4V characterization without post-processing but with relevant property data; reviews of Ti-6Al-4V post-processing.
      Low: titanium papers with no post-processing and no property linkage.
      Exclude: papers about hip-joint surgery/arthroplasty clinical outcomes (this is HIP = pressing, not the hip joint), or non-titanium unrelated topics.
    color: "#8A6D3B"
    sources:
      arxiv_categories: ["cond-mat.mtrl-sci"]
      openalex_concepts: []
      openalex_keywords:
        - "Ti-6Al-4V hot isostatic pressing"
        - "heat treatment additive manufacturing titanium"
        - "hot isostatic pressing porosity additive"
        - "post-processing additive manufacturing titanium"
        - "Ti-6Al-4V selective laser melting microstructure"
        - "annealing laser powder bed fusion titanium"
        - "Ti-6Al-4V mechanical properties additive"
      pubmed_terms:
        - "Ti-6Al-4V additive manufacturing heat treatment"
    strong_keywords:
      - "hot isostatic pressing"
      - "Ti-6Al-4V"
      - "Ti6Al4V"
      - "Ti-6Al-4V ELI"
      - "titanium alloy"
      - "heat treatment"
      - "stress relief"
      - "solution treatment"
      - "aging treatment"
      - "annealing"
      - "microstructure evolution"
      - "post-processing"
    must_pair_with: &am_terms
      - "additively manufactured"
      - "additive manufacturing"
      - "selective laser melting"
      - "selective laser melted"
      - "laser powder bed fusion"
      - "laser powder bed fused"
      - "powder bed fusion"
      - "electron beam melting"
      - "directed energy deposition"
      - "wire arc additive"
      - "3d printing"
      - "3d printed"
      - "3d-printed"
      - "additively-manufactured"
      - "slm"
      - "lpbf"
      - "l-pbf"
      - "ebm"
      - "waam"
      - "ded"

  am_femoral_stem:
    display_name: "Femoral Stem (AM + traditional)"
    llm_prompt_focus: |
      This direction tracks FEMORAL STEM design and mechanical performance — both additively manufactured AND conventional/traditional stems are in scope. Biomechanics/implant-mechanics context is welcome here, but a stem paper need not use AI or FEA-surrogate methods. Modeling, simulation, and computational studies (FE, crystal plasticity, phase-field, lattice/topology modeling, ML prediction) are fully in scope and judged on their own merit — do NOT down-rank a paper merely for being computational rather than experimental.
      Direct (High if novel + has mechanical/biomechanical analysis or testing): femoral stem design, porous or lattice stems, stress shielding, primary stability, micromotion, bone-implant interface, or stem fatigue/strength (AM or conventional).
      Medium: femoral stem reviews, FEA-only stem studies, or hip-implant mechanics closely tied to the stem.
      Low: general hip arthroplasty clinical/outcome papers with no stem mechanics or design content.
      Exclude: unrelated orthopaedic or clinical topics with no femoral stem focus.
    color: "#1F6FB2"
    sources:
      arxiv_categories: ["cond-mat.mtrl-sci"]
      openalex_concepts: []
      openalex_keywords:
        - "additive manufacturing femoral stem"
        - "porous titanium hip stem"
        - "lattice femoral stem"
        - "cementless femoral stem"
        - "femoral stem stress shielding"
        - "femoral stem design"
      pubmed_terms:
        - "femoral stem"
        - "hip stem design"
    strong_keywords:
      - "femoral stem"
      - "hip stem"
      - "short stem"
      - "porous stem"
      - "lattice stem"
    must_pair_with: *am_terms
