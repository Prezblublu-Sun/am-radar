name: daily-research-radar

on:
  # Schedule intentionally disabled for AM radar. Only workflow_dispatch is
  # active until the user explicitly re-enables it. When re-enabling, the
  # cron MUST be "30 4 * * *" — staggered from the sister radar's 03:00 UTC
  # OpenAlex window to avoid colliding on the shared OPENALEX_EMAIL polite
  # pool.
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      - name: Fetch and process papers
        # AM radar: no ZOTERO_* env vars — Zotero sync is skipped by default
        # in pipeline.run_daily. Do not re-add them without flipping the
        # default first.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          OPENALEX_EMAIL: ${{ vars.OPENALEX_EMAIL }}
          PUBMED_EMAIL: ${{ vars.PUBMED_EMAIL }}
          SCORER_PROMPT_FILE: scorer_v3.txt
        run: python -m pipeline.run_daily

      - name: SCOPE.md boundary audit
        id: scope_audit
        continue-on-error: true
        run: |
          python -m pipeline.scope_audit \
            --output "data/audit/scope_audit_$(date -u +%Y-%m-%d).json"

      - name: Export candidates for lit-system
        run: python -m pipeline.export_candidates

      - name: Commit results
        run: |
          git config user.name "research-radar-bot"
          git config user.email "actions@github.com"
          git add data/ docs/ CHANGELOG.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "daily: $(date -u +%Y-%m-%d)"
          git push

      - name: Fail if scope_audit reported errors
        if: steps.scope_audit.outcome == 'failure'
        run: |
          echo "::error::scope_audit detected SCOPE.md boundary violations. See data/audit/scope_audit_$(date -u +%Y-%m-%d).json in the latest commit."
          exit 1
